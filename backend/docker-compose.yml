version: '3.8'

services:
  api:
    build: .
    container_name: asha_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://asha_user:asha_password@db:5432/asha_route_optimizer_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_jwt_key_change_in_production_2026
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    container_name: asha_postgres_db
    environment:
      - POSTGRES_USER=asha_user
      - POSTGRES_PASSWORD=asha_password
      - POSTGRES_DB=asha_route_optimizer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: asha_redis_cache
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
